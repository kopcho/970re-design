<title>970.re — The search that hunts for you</title>
<style>
  :root{
    --forest:#0E2A1B; --forest-2:#163A27; --forest-3:#1E4A32;
    --bone:#F3F1E9; --mist:rgba(243,241,233,.52); --mist-2:rgba(243,241,233,.30);
    --gold:#C79A3E; --gold-soft:#D8B25E; --spark:#FF6B35; --amber:#E0A24A;
    --line:rgba(243,241,233,.12);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% -10%,#123322,#0A2015 70%);font-family:var(--sans);
    color:var(--bone);display:flex;align-items:center;justify-content:center;padding:20px;min-height:100dvh}
  .device{width:100%;max-width:400px;height:100dvh;max-height:860px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#10301F,#0C2417);border-radius:34px;border:1px solid rgba(243,241,233,.08);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(243,241,233,.06);display:flex;flex-direction:column}
  @media(max-width:440px){.device{border-radius:0;height:100dvh;max-height:none}}
  .scroll{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}.scroll::-webkit-scrollbar{display:none}

  .gauge{padding:26px 24px 14px;text-align:center}
  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
  .count{font-family:var(--serif);font-weight:600;font-size:74px;line-height:.94;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;color:var(--bone);transition:color .3s;margin-top:2px}
  .count.tighten{color:#8FE0A6}
  .count-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mist)}

  .plan{padding:2px 20px 4px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:500}
  .pchip.base{background:var(--forest-3);color:var(--mist);border:1px solid var(--line)}
  .pchip.must{background:linear-gradient(180deg,#D8B25E,#BE8F2E);color:#241C08;box-shadow:0 2px 8px -2px rgba(199,154,62,.5)}
  .pchip .x{opacity:.6;cursor:pointer;font-size:13px;line-height:1;margin-left:1px}
  .pchip .x:hover{opacity:1}
  .pchip.enter{animation:pop .42s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 20px 20px;min-height:0}

  .qcard{background:linear-gradient(180deg,#1B4530,#143726);border:1px solid var(--line);border-radius:20px;
    padding:20px 20px 18px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
  .qcard.in{animation:cardin .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes cardin{0%{opacity:0;transform:translateY(14px) scale(.98)}100%{opacity:1;transform:none}}
  .agent{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .ava{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E7CE93,#BE8F2E);
    color:#241C08;font-family:var(--serif);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(199,154,62,.15)}
  .agent .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
  .qtext{font-family:var(--serif);font-size:22px;line-height:1.28;color:var(--bone);text-wrap:balance;font-weight:500}
  .qhint{font-family:var(--mono);font-size:11px;color:var(--mist);margin-top:9px;letter-spacing:.02em}
  .qhint b{color:var(--gold-soft);font-weight:600}
  .qbtns{display:flex;gap:9px;margin-top:18px}
  .btn{flex:1;padding:13px 10px;border-radius:12px;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:600;
    transition:transform .1s,filter .2s}
  .btn:active{transform:scale(.96)}
  .btn.yes{background:linear-gradient(180deg,#D8B25E,#BE8F2E);color:#241C08;box-shadow:0 3px 12px -3px rgba(199,154,62,.55)}
  .btn.no{background:var(--forest-3);color:var(--bone);border:1px solid var(--line)}
  .qskip{display:block;margin:12px auto 0;background:none;border:none;color:var(--mist);font-family:var(--mono);
    font-size:11px;letter-spacing:.05em;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .qskip:hover{color:var(--bone)}

  .thinking{display:flex;align-items:center;gap:11px;justify-content:center;padding:30px 0;animation:cardin .3s ease}
  .thinking .ava{width:26px;height:26px;font-size:12px}
  .dots{display:flex;gap:5px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);animation:blink 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .thinking .tt{font-family:var(--mono);font-size:11px;color:var(--mist);letter-spacing:.04em}

  .done{text-align:center;animation:cardin .5s ease}
  .done .ring{width:60px;height:60px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    background:rgba(143,224,166,.1);border:1.5px solid rgba(143,224,166,.35);color:#8FE0A6;font-size:26px}
  .done h2{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--bone);margin-bottom:8px;text-wrap:balance}
  .done p{font-size:13.5px;color:var(--mist);line-height:1.55;max-width:280px;margin:0 auto 20px}
  .done p b{color:var(--bone)}
  .alert{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:12px;cursor:pointer;border:none;
    background:linear-gradient(180deg,#D8B25E,#BE8F2E);color:#241C08;font-family:var(--sans);font-size:14px;font-weight:600;
    box-shadow:0 4px 16px -4px rgba(199,154,62,.5)}
  .alert:active{transform:scale(.97)}
  .restart{display:block;margin:16px auto 0;background:none;border:none;color:var(--mist);font-family:var(--mono);font-size:11px;
    letter-spacing:.05em;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .foot{padding:10px 20px 18px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mist-2)}
  .foot b{color:var(--mist)}
</style>

<div class="device"><div class="scroll">
  <div class="gauge">
    <div class="eyebrow">Homes that match — strict</div>
    <div class="count" id="count">0</div>
    <div class="count-label">for sale, right now</div>
  </div>
  <div class="plan" id="plan"></div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="foot"></div>
</div></div>

<script>
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');

const DIMS=[
  {key:'quiet',    label:'Quiet street',        p:.45, type:'narrow', ask:(t,n)=>`${n-t} of these back to a busy road. Want <em>quiet streets only</em>?`,   hint:(t,n)=>`${t} of ${n} are on quiet streets`},
  {key:'garage',   label:'Garage',              p:.60, type:'narrow', ask:(t,n)=>`${n-t} have <em>no garage</em>. Make a garage a must-have?`,                 hint:(t,n)=>`${t} of ${n} have a garage`},
  {key:'basement', label:'Finished basement',   p:.42, type:'narrow', ask:(t,n)=>`Want a <em>finished basement</em>?`,                                          hint:(t,n)=>`${t} of ${n} have one`},
  {key:'openspace',label:'Backs to open space', p:.33, type:'narrow', ask:(t,n)=>`${t} back to <em>open space</em> instead of a neighbor. Prefer those?`,       hint:(t,n)=>`${t} of ${n} back to open space`},
  {key:'roof',     label:'Newer roof',          p:.50, type:'narrow', ask:(t,n)=>`Care about a <em>newer roof</em>? Make it a must?`,                            hint:(t,n)=>`${t} of ${n} have a newer roof`},
  {key:'laundry',  label:'Main-floor laundry',  p:.48, type:'narrow', ask:(t,n)=>`Need the <em>laundry on the main floor</em>?`,                                 hint:(t,n)=>`${t} of ${n} do`},
  {key:'single',   label:'Single-story',        p:.34, type:'narrow', ask:(t,n)=>`<em>Single-story only</em>? No stairs.`,                                       hint:(t,n)=>`${t} of ${n} are true ranches`},
  {key:'view',     label:'Mountain view',       p:.26, type:'narrow', ask:(t,n)=>`${t} have a real <em>mountain view</em>. Does that matter?`,                   hint:(t,n)=>`${t} of ${n} have the view`},
  {key:'drop',     label:'Fresh price cuts',    p:.20, type:'sort',   ask:(t,n)=>`${t} just <em>cut their price</em> this week. Want those up top?`,              hint:(t,n)=>`sorts, doesn’t narrow`},
];

// synthetic inventory so the questions are genuinely data-driven
const homes=[];
for(let i=0;i<420;i++){const h={id:i,price:300000+Math.round(Math.random()*520000),beds:2+Math.floor(Math.random()*4)};
  for(const d of DIMS)h[d.key]=Math.random()<d.p; homes.push(h);}

let required=new Set(), answered=new Set(), deferred=new Set(), sortFlag=false, current=null, startCount=0;
const base=h=>h.price<=500000 && h.beds>=3;
const matchesNow=()=>homes.filter(h=>base(h)&&[...required].every(k=>h[k]));
let shown=0;

const countEl=$('#count'),planEl=$('#plan'),stageEl=$('#stage'),footEl=$('#foot');
function roll(to,tighten){if(RM){countEl.textContent=fmt(to);shown=to;return;}
  const from=shown,dur=640,st=performance.now(),ease=t=>1-Math.pow(1-t,3);
  countEl.classList.toggle('tighten',tighten);
  (function f(now){const t=Math.min(1,(now-st)/dur);countEl.textContent=fmt(Math.round(from+(to-from)*ease(t)));
    if(t<1)requestAnimationFrame(f);else{countEl.textContent=fmt(to);setTimeout(()=>countEl.classList.remove('tighten'),240);}})(st);
  shown=to;}

function renderPlan(newKey){
  planEl.innerHTML='';
  const add=(cls,txt,key)=>{const c=document.createElement('span');c.className='pchip '+cls+(key===newKey?' enter':'');
    c.innerHTML=txt+(key?'<span class="x" data-k="'+key+'">×</span>':''); if(key)c.querySelector('.x').onclick=()=>undo(key); planEl.appendChild(c);};
  add('base','Loveland'); add('base','Under $500K'); add('base','3+ bed');
  for(const k of required){const d=DIMS.find(x=>x.key===k); add('must','✦ '+d.label,k);}
  if(sortFlag){const c=document.createElement('span');c.className='pchip must';c.innerHTML='↑ Price cuts first';planEl.appendChild(c);}
}
function undo(key){required.delete(key);answered.delete(key);deferred.delete(key);
  const m=matchesNow();roll(m.length,false);renderPlan();step();}

function nextQ(){
  const m=matchesNow();
  let pool=DIMS.filter(d=>!answered.has(d.key)&&!deferred.has(d.key));
  if(!pool.length) pool=DIMS.filter(d=>deferred.has(d.key)&&!answered.has(d.key)); // resurface "not sure"
  let best=null,bs=-1;
  for(const d of pool){const n=m.length,t=m.filter(h=>h[d.key]).length;
    if(d.type==='sort'){if(t>=2&&!sortFlag){const sc=.40;if(sc>bs){bs=sc;best=d;}}continue;}
    if(t===0||t===n)continue; const sc=1-Math.abs(t/n-.5)*2; if(sc>bs){bs=sc;best=d;}}
  if(!best) return null;
  if(best.type==='narrow'&&bs<.14) return null;
  if(m.length<=6) return null;
  return {d:best,t:m.filter(h=>h[best.key]).length,n:m.length};
}

function think(cb){
  stageEl.innerHTML='<div class="thinking"><div class="ava">R</div><div class="dots"><i></i><i></i><i></i></div><div class="tt">reading your homes…</div></div>';
  if(RM){cb();return;} setTimeout(cb,560);
}
function renderQ(q){current=q;const d=q.d;
  const sort=d.type==='sort';
  stageEl.innerHTML=`<div class="qcard in">
    <div class="agent"><div class="ava">R</div><div class="who">Rich · narrowing</div></div>
    <div class="qtext">${d.ask(q.t,q.n)}</div>
    <div class="qhint">${d.hint(q.t,q.n)}</div>
    <div class="qbtns">
      <button class="btn yes" data-a="yes">${sort?'Yes, up top':'Yes — must-have'}</button>
      <button class="btn no" data-a="no">${sort?'No thanks':'Doesn’t matter'}</button>
    </div>
    ${sort?'':'<button class="qskip" data-a="skip">Not sure — ask me later</button>'}
  </div>`;
  stageEl.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(b.dataset.a));
  footEl.innerHTML=`Answered <b>${answered.size}</b> · started at <b>${fmt(startCount)}</b> → now <b>${fmt(matchesNow().length)}</b>`;
}
function renderDone(){const n=matchesNow().length;
  stageEl.innerHTML=`<div class="done">
    <div class="ring">✓</div>
    <h2>You’re dialed in.</h2>
    <p><b>${fmt(n)} homes</b> match every answer${sortFlag?', freshest price cuts first':''} — and not one drifts outside what you asked.</p>
    <button class="alert" id="alertbtn">🔔 &nbsp;Text me the moment a new one hits</button>
    <button class="restart" id="restart">start over</button>
  </div>`;
  $('#alertbtn').onclick=()=>{$('#alertbtn').textContent='✓  You’ll hear from me';$('#alertbtn').style.filter='saturate(.7)';};
  $('#restart').onclick=reset;
  footEl.innerHTML=`Answered <b>${answered.size}</b> · <b>${fmt(startCount)}</b> → <b>${fmt(n)}</b> in ${answered.size} taps`;
}
function step(){const q=nextQ(); renderPlan(); if(!q){renderDone();}else{renderQ(q);} }
function answer(kind){const q=current;if(!q)return;const d=q.d;let tightened=false;
  if(kind==='yes'){ if(d.type==='sort'){sortFlag=true;} else {required.add(d.key);tightened=true;} answered.add(d.key);deferred.delete(d.key);}
  else if(kind==='no'){ answered.add(d.key);deferred.delete(d.key);}
  else { deferred.add(d.key);}
  const m=matchesNow(); const newKey=(kind==='yes'&&d.type==='narrow')?d.key:null;
  roll(m.length,tightened); renderPlan(newKey);
  think(step);
}
function reset(){required=new Set();answered=new Set();deferred=new Set();sortFlag=false;
  const m=matchesNow();shown=m.length;countEl.textContent=fmt(m.length);renderPlan();step();}

startCount=matchesNow().length; shown=startCount; countEl.textContent=fmt(startCount); renderPlan();
think(step);
</script>
